# Local development — PostgreSQL + MinIO included
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: geotask-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: geotask
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotask"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - geotask-network

  storage:
    image: minio/minio
    container_name: geotask-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - geotask-network

  app:
    image: ${APP_IMAGE:-ghcr.io/YOUR_ORG/geotask-pro:main}
    container_name: geotask-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@db:5432/geotask?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@db:5432/geotask?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Mudar@123}
      ADMIN_MAINTENANCE_SECRET: ${ADMIN_MAINTENANCE_SECRET}
      # MinIO as S3-compatible storage
      AWS_S3_ENDPOINT: http://storage:9000
      AWS_S3_BUCKET: task-attachments
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - geotask-network

  nginx:
    image: nginx:alpine
    container_name: geotask-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - geotask-network

networks:
  geotask-network:
    driver: bridge

volumes:
  pgdata:
  minio-data:

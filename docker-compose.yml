services:
  db:
    image: postgres:16-alpine
    container_name: geotask-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: geotask
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotask"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - geotask-network

  storage:
    image: minio/minio
    container_name: geotask-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    networks:
      - geotask-network
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    image: ghcr.io/dev-vra/geotask-pro-vps:main
    container_name: geotask-app
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/geotask?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/geotask?schema=public
      AWS_S3_ENDPOINT: http://storage:9000
      AWS_S3_BUCKET: task-attachments
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      NODE_ENV: production
      NEXTAUTH_URL: https://geotask.duckdns.org
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - geotask-network

  nginx:
    image: nginx:alpine
    container_name: geotask-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - geotask-network

networks:
  geotask-network:
    driver: bridge

volumes:
  pgdata:
  minio-data:

# Production — AWS EC2 + RDS + S3
# Prerequisites:
#   - Copy .env.example to .env and fill all values
#   - SSL certs in ./nginx/certs/ (fullchain.pem + privkey.pem)
#   - RDS PostgreSQL instance running and accessible
#   - S3 bucket created with appropriate IAM permissions

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/YOUR_ORG/geotask-pro:main}
    container_name: geotask-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - geotask-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: geotask-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - geotask-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  geotask-network:
    driver: bridge
